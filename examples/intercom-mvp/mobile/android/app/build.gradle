plugins { id 'com.android.application' }
android {
  namespace 'dev.ponytail.intercom'
  compileSdk 35
  ndkVersion '28.2.13676358'
  defaultConfig {
    applicationId 'dev.ponytail.intercom'
    minSdk 28
    externalNativeBuild { cmake { targets 'intercom' } }
    targetSdk 35
    versionCode 1
    versionName '0.1.0'
    externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; abiFilters 'arm64-v8a', 'x86_64' } }
    ['firebaseApiKey', 'firebaseApplicationId', 'firebaseProjectId', 'firebaseSenderId'].each { key ->
      buildConfigField 'String', key, '"' + (project.findProperty(key) ?: '') + '"'
    }
  }
  buildFeatures { buildConfig true }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  externalNativeBuild { cmake { path '../../../native/CMakeLists.txt'; version '3.22.1'; if (project.hasProperty('nativeBuildDir')) buildStagingDirectory file(project.property('nativeBuildDir')) } }
}
dependencies { implementation 'com.google.firebase:firebase-messaging:24.1.2' }
