name: intercom
on:
  pull_request:
    paths: ['examples/intercom-mvp/**', 'tests/intercom.test.js', '.github/workflows/intercom.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Build native SIP, APK, and run Android lint
        working-directory: examples/intercom-mvp/mobile/android
        run: bash gradlew assembleDebug lintDebug --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intercom-debug-apk
          path: examples/intercom-mvp/mobile/android/app/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build libbaresip and native bridge for the iOS simulator
        working-directory: examples/intercom-mvp/native
        run: |
          cmake -S . -B build-ios -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ios --target intercom -j 3
      - name: Build iOS shell without signing
        working-directory: examples/intercom-mvp/mobile/ios
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project IntercomMvp.xcodeproj -scheme IntercomMvp -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
